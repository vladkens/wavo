[package]
name = "wavo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "wavo"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:hound", "dep:ureq"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bytemuck = "1.25.2"
half = "2.7.1"
hound = { version = "3.5.1", optional = true }
pollster = "1.0.1"
rustfft = "6.4.1"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }

[dev-dependencies]
hound = "3.5.1"

[profile.release]
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
