[package]
name = "wavo"
version = "0.1.0"
edition = "2024"
description = "Speech-to-text in pure Rust on the GPU (Metal, Vulkan): Parakeet, GigaAM and Whisper, as a library and an ollama-like CLI."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/wavo"
homepage = "https://github.com/vladkens/wavo"
documentation = "https://docs.rs/wavo"
readme = "readme.md"
include = ["/src/**/*.rs", "/src/**/*.wgsl","/Cargo.toml", "/Cargo.lock", "/LICENSE", "/readme.md"]
keywords = ["speech-to-text", "asr", "transcription", "whisper", "gpu"]
categories = ["multimedia::audio", "command-line-utilities"]

[package.metadata.docs.rs]
no-default-features = true

[[bin]]
name = "wavo"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:rubato", "dep:symphonia", "dep:ureq"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bytemuck = "1.25.2"
half = "2.7.1"
pollster = "1.0.1"
rubato = { version = "5.0.1", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "isomp4", "aac", "flac", "ogg", "vorbis"], optional = true }
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan"] }

[dev-dependencies]
hound = "3.5.1"

[profile.release]
debug = 1

# The prebuilt binaries of `make dist`: file and line in backtraces at a smaller size.
[profile.dist]
inherits = "release"
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
