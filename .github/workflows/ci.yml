name: ci

# Never add pull_request_target or issue_comment: they run untrusted code with the base branch's
# rights and can poison its cache. With push and pull_request GitHub keeps PR caches to the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test-unit

  # A push to main updates the `dev` pre-release; a manual run on a branch keeps the archives as
  # workflow artifacts.
  dev:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: dev-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      # One cache for the registry, cargo-cross, the targets' dependencies and the cross toolchains.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ runner.temp }}/cross
      - run: cargo install --locked cargo-cross@1.6.0
      - run: make dist
        env:
          CROSS_COMPILER_DIR: ${{ runner.temp }}/cross

      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: wavo-dev
          path: target/dist/*

      - name: Update dev pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main)
          if [ "$(echo "$head" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA, skipping"
            exit 0
          fi
          NOTES="Latest build of \`main\` at ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          git tag -f dev
          git push -f origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev target/dist/* --clobber
            gh release edit dev --title "Dev build" --notes "$NOTES"
          else
            gh release create dev target/dist/* --prerelease --title "Dev build" --notes "$NOTES"
          fi
