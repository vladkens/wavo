name: ci

# Never add pull_request_target or issue_comment: they run untrusted code with the base branch's
# rights and can poison its cache. With push and pull_request GitHub keeps PR caches to the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test-unit

  # A push to main updates the `dev` pre-release; a manual run on a branch keeps the archives as
  # workflow artifacts.
  dev:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: dev-release
    steps:
      - uses: actions/checkout@v7
      # One cache for the registry, cargo-cross, the targets' dependencies and the cross toolchains.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ runner.temp }}/cross
      - run: cargo install --locked cargo-cross@1.6.0
      - run: scripts/build-dev.sh
        env:
          CROSS_COMPILER_DIR: ${{ runner.temp }}/cross
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: wavo-dev
          path: target/dist/*
      - if: github.ref == 'refs/heads/main'
        run: scripts/publish-dev.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
