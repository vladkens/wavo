name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest # the only GitHub runners with a GPU: the tests run models on Metal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.event_name != 'pull_request' }}
      # The CI models' Hugging Face cache, keyed by their names. Only main saves it: a PR's cache
      # would serve that PR alone and count against the repo's quota.
      - id: models
        run: echo "key=hf-$(sed -n 's/^CI_MODELS := //p' Makefile | tr ' ' '+')" >> "$GITHUB_OUTPUT"
      - id: hf
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make build
      - run: make models-ci > "$RUNNER_TEMP/models.log" 2>&1 & # downloads in the background
      - run: make check
      - run: make samples
      - run: make models-ci # waits for those downloads, or retries a failed one
      - if: github.ref == 'refs/heads/main' && steps.hf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: make test-ci

  # A slowdown only warns; a broken build or a failing model fails the job.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest # a GPU, as for `test`
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the parent commit too, to see whether src/ changed
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: make bench-compare
        env:
          GH_TOKEN: ${{ github.token }}

  # The shared release steps: `build` runs `make dist` read-only (beside `test`); on main `publish`
  # puts the archives up as the `dev` pre-release, and a `release: vX.Y.Z (#N)` commit publishes
  # the crate and the same archives as the version. `publish` never compiles. Users check an
  # archive with `gh attestation verify FILE -R vladkens/wavo`.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          dist: make dist
          cache-directories: ~/.cache/cargo-cross

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
