name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest # the only GitHub runners with a GPU: the tests run models on Metal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.event_name != 'pull_request' }}
      # The smoke models' Hugging Face cache, keyed by their names. Only main saves it: a PR's cache
      # would serve that PR alone and count against the repo's quota.
      - id: models
        run: echo "key=hf-$(sed -n 's/^MODELS := //p' Makefile | tr ' ' '+')" >> "$GITHUB_OUTPUT"
      - id: hf
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make build
      - run: make models > "$RUNNER_TEMP/models.log" 2>&1 & # downloads in the background
      - run: make check
      - run: make samples
      - run: make models # waits for those downloads, or retries a failed one
      - if: github.ref == 'refs/heads/main' && steps.hf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: make test
      - run: make test-portable

  # A slowdown only warns; a broken build or a failing model fails the job.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest # a GPU, as for `test`
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the parent commit too, to see whether src/ changed
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: make bench-compare
        env:
          GH_TOKEN: ${{ github.token }}

  # The shared release steps: `build` builds the archives read-only (beside `test`); on main `publish`
  # puts the archives up as the `dev` pre-release, and a `release: vX.Y.Z (#N)` commit publishes
  # the crate and the same archives as the version. `publish` never compiles. Users check an
  # archive with `gh attestation verify FILE -R vladkens/wavo`.
  build:
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          targets: aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu
          profile: dist
          dev: true

  # The Docker image for both platforms, from Linux binaries cross-built with cargo-solo; read-only
  # as `build`. Main keeps buildx's cache (Mesa's AMD driver takes minutes to build) and the image,
  # which `docker-publish` pushes on a release.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docker
          cache-directories: ~/.cache/cargo-solo # the glibc sysroots
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo install --locked --git https://github.com/vladkens/cargo-solo --rev aa44be4cb4cc20ba93d4ec8d3c4706963224522f cargo-solo
      - run: make docker-dist
      - uses: docker/setup-qemu-action@v4 # arm64's apt-get
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          outputs: ${{ github.ref == 'refs/heads/main' && 'type=oci,dest=wavo.oci.tar' || '' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker
          path: wavo.oci.tar
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: vladkens/actions/rust-publish@v1

      - uses: vladkens/actions/homebrew-bump@v1
        with:
          tag: ${{ steps.release.outputs.tag }}
          file: ${{ steps.release.outputs.files }}
          tap: vladkens/homebrew-tap
          token: ${{ secrets.HOMEBREW_REPO_TOKEN }}

  # A release's image on ghcr.io as X.Y.Z, and as latest when its tag is the newest (a rerun of an
  # older release keeps latest): `docker`'s image as it was built; never compiles.
  docker-publish:
    needs: [publish, docker]
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker
      - env:
          TAG: ${{ needs.publish.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          image=ghcr.io/$GITHUB_REPOSITORY
          skopeo copy --all oci-archive:wavo.oci.tar "docker://$image:${TAG#v}"
          repo=https://github.com/$GITHUB_REPOSITORY
          newest=$(git ls-remote --tags --refs "$repo" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n1)
          if [ "$TAG" = "$newest" ]; then
            skopeo copy --all oci-archive:wavo.oci.tar "docker://$image:latest"
          fi
