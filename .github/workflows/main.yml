name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest # the only GitHub runners with a GPU: the tests run models on Metal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.event_name != 'pull_request' }}
      # The CI models' Hugging Face cache, keyed by their names. Only main saves it: a PR's cache
      # would serve that PR alone and count against the repo's quota.
      - id: models
        run: echo "key=hf-$(sed -n 's/^CI_MODELS := //p' Makefile | tr ' ' '+')" >> "$GITHUB_OUTPUT"
      - id: hf
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make build
      - run: make models-ci > "$RUNNER_TEMP/models.log" 2>&1 & # downloads in the background
      - run: make check
      - run: make samples
      - run: make models-ci # waits for those downloads, or retries a failed one
      - if: github.ref == 'refs/heads/main' && steps.hf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      - run: make test-ci

  # A slowdown only warns; a broken build or a failing model fails the job.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest # a GPU, as for `test`
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the parent commit too, to see whether src/ changed
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: make bench-compare
        env:
          GH_TOKEN: ${{ github.token }}

  # `dev` builds the archives next to `test` (main and manual runs); on main `dev-release` publishes
  # them as the `dev` pre-release. Two jobs, so the token that can write to the repo never sits on
  # the machine that runs the build scripts of every dependency.
  dev:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      # One cache for the registry, cargo-cross, the targets' dependencies and the cross toolchains.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ runner.temp }}/cross
      - run: make dist
        env:
          CROSS_COMPILER_DIR: ${{ runner.temp }}/cross
      - uses: actions/upload-artifact@v7
        with:
          name: wavo-dev
          path: target/distrib/*

  dev-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # no GPU or build here, and Linux runners start faster
    needs: [test, dev]
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: dev-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wavo-dev
          path: target/distrib
      - id: dev
        uses: vladkens/actions/dev-release@v1
        with:
          files: target/distrib/*
      # Users check an archive with `gh attestation verify FILE -R vladkens/wavo`.
      - if: steps.dev.outputs.skipped == 'false'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.dev.outputs.files }}

  # Split like `dev`: `release-check` builds without write rights, `release` only publishes.
  release-check:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: vladkens/actions/release-check@v1
      - uses: vladkens/actions/crates-publish@v1
        with:
          dry-run: true

  release:
    runs-on: ubuntu-latest
    needs: [test, dev, release-check]
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wavo-dev
          path: target/distrib # git-ignored, so cargo publish packs a clean tree
      # https://crates.io/docs/trusted-publishing
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - uses: vladkens/actions/crates-publish@v1
        with:
          token: ${{ steps.auth.outputs.token }}
          no-verify: true
      - id: release
        uses: vladkens/actions/github-release@v1
        with:
          tag: ${{ needs.release-check.outputs.tag }}
          notes: ${{ needs.release-check.outputs.notes }}
          files: target/distrib/*
          rename-from: wavo-dev-
          rename-to: wavo-${{ needs.release-check.outputs.tag }}-
      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release.outputs.files }}
